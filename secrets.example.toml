# Copy to .streamlit/secrets.toml for local runs. NEVER commit the real file.
# On Streamlit Community Cloud, paste these same lines into
# Manage app -> Settings -> Secrets instead of putting them in the repo.

# Required: reads X through twitterapi.io
TWITTERAPI_IO_KEY = "your-twitterapi-io-key"

# Optional: pre-fills the app so it shows matches on load with nothing typed in.
# \n separates keywords.
DEFAULT_LIST_URL = "https://x.com/i/lists/1234567890123456789"
DEFAULT_KEYWORDS = "ICE\nvoted against\nborder bill"

# Optional: enables the "Send me a summary now" button.
# Gmail needs an App Password (2-Step Verification on, then
# https://myaccount.google.com/apppasswords), not the account password.
SENDER_EMAIL = "you@gmail.com"
SENDER_APP_PASSWORD = "abcd efgh ijkl mnop"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
